<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New Tab</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0d0f14; color: #fff; font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; }
  #bg { position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 120%, #1d2540, #0d0f14 60%) center / cover no-repeat;
        opacity: 0; transition: opacity .6s; }
  #bg.ready { opacity: 1; }
  #dim { position: fixed; inset: 0; background: #000; pointer-events: none; }
  main { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 16px; box-sizing: border-box; }
  #time { font-size: clamp(64px, 11vw, 132px); font-weight: 200; letter-spacing: -2px; line-height: 1; text-shadow: 0 2px 24px rgba(0,0,0,.4); }
  #date { font-size: 17px; opacity: .8; margin-top: -10px; text-shadow: 0 1px 8px rgba(0,0,0,.5); }
  form { width: min(560px, 100%); }
  input { width: 100%; box-sizing: border-box; padding: 13px 18px; border-radius: 999px; border: 1px solid rgba(255,255,255,.25);
          background: rgba(20,22,30,.45); backdrop-filter: blur(14px); color: #fff; font: inherit; font-size: 16px; outline: none; }
  input::placeholder { color: rgba(255,255,255,.65); }
  input:focus { border-color: rgba(255,255,255,.55); }
  footer { position: fixed; left: 16px; right: 16px; bottom: 12px; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; font-size: 12px; }
  #credit { opacity: .7; max-width: 70%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
  #credit a { color: inherit; }
  #next { border: 0; border-radius: 999px; padding: 7px 13px; background: rgba(20,22,30,.5); backdrop-filter: blur(10px); color: #fff; font: inherit; cursor: pointer; }
  #hint { opacity: .75; text-align: center; max-width: 420px; line-height: 1.5; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="bg"></div>
<div id="dim"></div>
<main>
  <div id="clock"><div id="time"></div><div id="date"></div></div>
  <form id="search" action="https://www.google.com/search">
    <input name="q" placeholder="Search Google or type a URL" autocomplete="off" autofocus>
  </form>
  <p id="hint" hidden>Click the Backdrop icon in your toolbar to search for backgrounds or upload your own.</p>
</main>
<footer>
  <span id="credit"></span>
  <button id="next" hidden>Next background →</button>
</footer>
<script src="db.js"></script>
<script src="newtab.js"></script>
</body>
</html>
